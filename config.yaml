# Qué se vigila y dónde.
#
# "temas" define grupos de palabras clave con sus variantes en castellano y
# catalán. Cada fuente declara qué temas y qué personas le interesan. Un acto
# se marca relevante si casa con alguna persona vigilada o con algún tema.
# Si una fuente no declara ni temas ni personas, todo lo suyo es relevante.

temas:
  agua:
    - agua
    - aigua
    - aigu
    - pluvial
    - clavegueram
    - sanejament
    - saneamiento
    - potable
    - hidric
    - hidrica
    - hidrico
    - sequia
    - sequera
    - abastament
    - abastecimiento
    - depuradora
    - dessaladora
    - desaladora
    - agencia catalana de l aigua
    - transvasament
    - trasvase
  residuos:
    - residu
    - residus
    - residuo
    - residuos
    - incinerador
    - incineradora
    - abocador
    - vertedero
    - economia circular
  reciclaje:
    - recicla
    - reciclatge
    - reciclaje
    - envas
    - envase
    - retorn d envasos
  energia:
    - energia
    - energetic
    - energetica
    - electric
    - renovable
    - fotovoltaic
    - eolic
    - eolica
    - nuclear
    - xarxa electrica
    - red electrica
  plenos:
    - ple municipal
    - pleno
    - plenari
    - plenario
    - ple del
    - ple de la
    - ple ordinari
    - ple extraordinari
    - pleno del
    - pleno municipal
    - sessio plenaria
    - sesion plenaria
    - comissio
    - comision informativa
    - junta de portaveus
  rueda_prensa:
    - roda de premsa
    - rueda de prensa
    - compareixenca
    - comparecencia
    - convocatoria de premsa
    - convocatoria de prensa

fuentes:
  - clave: moncloa
    nombre: Agenda del Gobierno de España
    organismo: Gobierno de España
    url: https://www.lamoncloa.gob.es/gobierno/agenda/paginas/agenda.aspx
    activa: true
    personas:
      - Pedro Sánchez
      - Yolanda Díaz
      - Carlos Cuerpo
      - Pablo Bustinduy
      - Sara Aagesen
    temas: []

  - clave: generalitat
    nombre: Agenda del Govern de Catalunya
    organismo: Generalitat de Catalunya
    url: https://govern.cat/gov/agenda
    activa: true
    personas:
      - Salvador Illa
      - Sílvia Paneque
    temas: [plenos]

  - clave: parlament
    nombre: Agenda del Parlament de Catalunya
    organismo: Parlament de Catalunya
    url: https://www.parlament.cat/web/actualitat/agenda/index.html
    activa: true
    personas: []
    temas: [agua, residuos, reciclaje, energia, plenos]

  - clave: acn
    nombre: Previsions de l'ACN
    organismo: Agència Catalana de Notícies
    url: https://www.acn.cat/previsions
    activa: true
    personas: []
    temas: [agua, residuos, reciclaje, energia, plenos, rueda_prensa]

  # Agenda diaria de EFE. La URL de cada fecha se genera en infobae_efe.py.
  - clave: infobae_efe
    nombre: Temas del dia de EFE Espana (Infobae)
    organismo: Agencia EFE
    url: https://www.infobae.com/espana/agencias/
    activa: true
    personas: []
    temas: [agua, residuos, reciclaje, energia, plenos, rueda_prensa]

  # Su web tiene Disallow en el robots.txt, así que no se raspa. Se lee
  # el conjunto de datos abiertos que publican ellos mismos
  - clave: diba
    nombre: Agenda corporativa de la Diputació de Barcelona
    organismo: Diputació de Barcelona
    url: https://do.diba.cat/api/dataset/agendageneral_ca/format/json
    activa: true
