name: Recolectar agendas

on:
  schedule:
    - cron: "0 5,7,9,11,13,15,17,19,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recolectar
        run: python -m recolector.main --dias-adelante 8 --dias-atras 1

      - name: Guardar cambios
        run: |
          git config user.name "recolector"
          git config user.email "recolector@users.noreply.github.com"
          git add docs/datos
          if git diff --staged --quiet; then
            echo "Sin cambios en la agenda"
          else
            git commit -m "Agenda actualizada $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
